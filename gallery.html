          <img
            class="brand-logo"
            src="https://assets.chsboyssoccer.com/images/Cypress_High_School_40th_Anniversary_Logo.png"
            alt="Cypress High School logo"
          >
          <span class="brand-copy">
            <span class="brand-title">Cypress Centurion</span>
            <span class="brand-subtitle">Boys Soccer</span>
          </span>
        </a>

        <button
          class="menu-toggle"
          type="button"
          aria-label="Open navigation menu"
          aria-controls="primary-navigation"

          <span></span>
          <span></span>

      <section class="gallery-section" aria-labelledby="gallery-title">
        <div class="gallery-heading">
          <h1 id="gallery-title">Photo Gallery</h1>
          <p>Moments from Cypress Boys Soccer.</p>
          <p class="gallery-credit">Images created by AM8 Media - Angel Martinez.</p>
        </div>

        <div class="gallery-status" data-gallery-status hidden></div>
        <div class="gallery-grid" data-gallery-list data-gallery-api="/api/gallery">
          <article class="gallery-empty">
            <p>Gallery collections will appear here soon.</p>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="social-links" aria-label="Social links">
        <a href="https://www.instagram.com/cypress_centurion_boys_soccer/" target="_blank" rel="noopener" aria-label="Instagram">
